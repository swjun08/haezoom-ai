<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>해줌 AI</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head><body class="popup"><header><div class="brand"><span class="logo">h.</span>해줌 AI</div><button id="settings" class="icon-button" aria-label="사용 안내">?</button></header><main><p class="intro">공지 속 할 일과 마감일을 한눈에 정리해요.</p><div class="input-actions" aria-label="문서 가져오기"><button id="capture" class="primary wide"><span>화면 캡쳐하기</span><span aria-hidden="true">▣</span></button><button id="upload" class="secondary wide"><span>PDF 업로드</span><span aria-hidden="true">↑</span></button><button id="selection" class="secondary wide"><span>선택한 내용 가져오기</span><span aria-hidden="true">→</span></button></div><button id="tasks" class="manage"><span>내 할 일 · 일정 관리</span><span aria-hidden="true">↗</span></button><p id="status" role="status" aria-live="polite"></p><details class="button-settings"><summary>해줌 버튼 표시 설정</summary><button id="global-helper" class="secondary wide">전체 사이트 설정 확인 중</button><button id="helper" class="secondary wide">현재 사이트 설정 확인 중</button><p>일반 웹사이트에 표시해요. 로컬 PDF는 파일 접근 허용이 필요해요.</p></details></main></body></html>
