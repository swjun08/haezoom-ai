<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해줌 · 캡쳐 확인</title><link rel="stylesheet" href="capture-review.css"><script src="vendor/tesseract/tesseract.min.js"></script><script type="module" src="capture-review.js"></script></head>
